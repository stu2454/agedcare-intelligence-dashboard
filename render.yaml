# Render Blueprint. In the Render dashboard: New > Blueprint, point it at this
# repo, and it will create the service below.
#
# This is a Static Site, not a web service: the dashboard is a bundle of static
# files with no server. That means it is free, never sleeps, and has no cold
# start — unlike the previous Docker web service, which Render reclaims after a
# period of inactivity on the free plan.
services:
  - type: web
    name: agedcare-intelligence-dashboard
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    autoDeploy: true
    # Single-page app: unknown paths serve index.html rather than 404ing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed asset filenames are immutable, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The app makes no network calls at all once loaded; this enforces that.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
