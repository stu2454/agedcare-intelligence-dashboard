# Local development. Builds the same Dockerfile Render uses, with PORT set
# explicitly the way Render injects it.
services:
  dashboard:
    build: .
    container_name: agedcare_dashboard_app
    ports:
      - "8510:8510"
    environment:
      PORT: "8510"
    volumes:
      # Swap in a different quarterly extract without rebuilding the image.
      - ./star-ratings-quarterly-data-extract-february-2025.xlsx:/app/star-ratings-quarterly-data-extract-february-2025.xlsx:ro
    restart: unless-stopped
